name: images
on:
  workflow_dispatch:
  push:
    paths: ['triggers/images.json']
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pillow "rembg[cpu]" onnxruntime
      - run: python tools/imagegen.py
      - name: Save
        if: always()
        run: |
          git config user.name "daily-shorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A assets/gen || true
          git commit -m "generated images" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
