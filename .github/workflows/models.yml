name: models
on:
  workflow_dispatch:
  push:
    paths: ['triggers/models.json']
permissions:
  contents: write
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/list_models.py
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      - run: |
          git config user.name "daily-shorts-bot"; git config user.email "bot@users.noreply.github.com"
          git add logs/models.txt; git commit -m "models list" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 3; done
